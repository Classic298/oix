[project]
name = "oix"
version = "0.5.0"
description = "Build external apps for Open WebUI"
readme = "README.md"
authors = [{ name = "Tim Baek", email = "tim@openwebui.com" }]
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "aiohttp>=3.12,<4",
    "python-socketio>=5.16.2,<6",
    "cryptography>=44",
    "PyJWT>=2.10,<3",
    "pydantic>=2.10,<3",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.115,<1"]
redis = ["redis>=5,<9"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.28", "ruff>=0.11", "twine>=6", "uvicorn[standard]>=0.30"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
